        function drawChartForSlide(index, isPrintVersion = false) {
            const suffix = isPrintVersion ? `-print-slide-${index}` : '';
            const chartIds = {
                9: 'chartPriceTrend',
                10: 'chartReturnTrend',
                11: 'chartHistogram',
                12: 'chartKde',
                13: 'chartBoxplot',
                14: 'chartRollingMean',
                15: 'chartRollingVol',
                21: 'chartConditionalVol',
                23: 'chartDrawdown',
                24: 'chartCrashClustering'
            };

            const canvasId = chartIds[index];
            if (!canvasId) return;

            let canvas;
            if (isPrintVersion) {
                const slideContainer = document.getElementById(`print-slide-${index}`);
                if (!slideContainer) return;
                canvas = slideContainer.querySelector('canvas');
            } else {
                canvas = document.getElementById(canvasId);
            }

            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            // Make canvas responsive
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const w = rect.width;
            const h = rect.height;

            // Draw clean background gridlines
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#232D3F';
            ctx.lineWidth = 0.5;
            
            // X & Y Gridlines
            for (let i = 1; i < 5; i++) {
                // Horizontal
                const y = (h / 5) * i;
                ctx.beginPath();
                ctx.moveTo(30, y);
                ctx.lineTo(w - 10, y);
                ctx.stroke();

                // Vertical
                const x = 30 + ((w - 40) / 5) * i;
                ctx.beginPath();
                ctx.moveTo(x, 10);
                ctx.lineTo(x, h - 20);
                ctx.stroke();
            }

            // Draw axis lines
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(30, 10);
            ctx.lineTo(30, h - 20);
            ctx.lineTo(w - 10, h - 20);
            ctx.stroke();

            // Render specific curves based on the slide
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (index === 9) {
                // Price Trend (Continuous increase starting near 17k reaching 26k with election dip)
                ctx.strokeStyle = '#00E676';
                ctx.beginPath();
                const points = 100;
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    // Generate Price Line: 17500 starting base climbing to 26200
                    let val = 17500 + (8700 / points) * i;
                    // Add noise
                    val += Math.sin(i / 5) * 200 + Math.cos(i / 10) * 150;
                    // Election dip in mid-2024 (around index 45)
                    if (i > 40 && i < 55) {
                        val -= (55 - i) * (i - 40) * 12; 
                    }
                    // Normalize to canvas height
                    const y = h - 25 - ((val - 16000) / (27000 - 16000)) * (h - 40);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            else if (index === 10) {
                // Daily Log Returns (Noise around zero mean with large spikes near election results)
                ctx.strokeStyle = '#2979FF';
                ctx.beginPath();
                const points = 150;
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    // Noise fluctuation
                    let val = (Math.random() - 0.5) * 1.5;
                    // Clustering behavior
                    if (i > 40 && i < 70) val *= 2.2;
                    if (i > 110 && i < 130) val *= 1.8;
                    // Massive Crash Shock
                    if (i === 65) val = -6.11;
                    // Normalize to canvas height
                    const y = (h / 2) - 5 + (val / 7.5) * ((h - 40) / 2);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            else if (index === 11) {
                // Histogram (Bar chart representing tall leptokurtic center)
                ctx.fillStyle = 'rgba(41, 121, 255, 0.4)';
                ctx.strokeStyle = '#2979FF';
                const bars = 25;
                for (let i = 0; i < bars; i++) {
                    const x = 35 + ((w - 50) / bars) * i;
                    const barW = ((w - 50) / bars) * 0.8;
                    // Generate tall leptokurtic heights
                    const distFromCenter = Math.abs(i - (bars / 2));
                    let height = Math.exp(-distFromCenter * 0.5) * (h - 50);
                    if (distFromCenter === 0) height *= 1.2; // Extra tall center
                    const y = h - 20 - height;
                    ctx.fillRect(x, y, barW, height);
                    ctx.strokeRect(x, y, barW, height);
                }
            }
            else if (index === 12) {
                // KDE vs Normal
                // 1. Normal Curve (Gray dashed line)
                ctx.strokeStyle = '#64748B';
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                const points = 100;
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    const dev = (i - (points / 2)) / 15;
                    const val = Math.exp(-0.5 * dev * dev) * (h - 70) * 0.5;
                    const y = h - 20 - val;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.setLineDash([]); // Reset line dashes

                // 2. KDE Curve (Red, tall peak, fat tails)
                ctx.strokeStyle = '#FF5252';
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    const dev = (i - (points / 2)) / 15;
                    // Fat tailed distribution formulation
                    let val = Math.exp(-Math.abs(dev) * 1.2) * (h - 50) * 0.7;
                    if (Math.abs(dev) > 2) val += 10; // Fat tails
                    const y = h - 20 - val;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            else if (index === 13) {
                // Horizontal Boxplot with Outliers
                const centerH = h / 2 - 5;
                // Outer Whiskers
                ctx.strokeStyle = '#64748B';
                ctx.beginPath();
                ctx.moveTo(60, centerH - 10);
                ctx.lineTo(60, centerH + 10);
                ctx.moveTo(60, centerH);
                ctx.lineTo(w - 80, centerH);
                ctx.moveTo(w - 80, centerH - 10);
                ctx.lineTo(w - 80, centerH + 10);
                ctx.stroke();

                // Box Area
                ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
                ctx.strokeStyle = '#FFD700';
                ctx.fillRect(w / 2 - 60, centerH - 25, 120, 50);
                ctx.strokeRect(w / 2 - 60, centerH - 25, 120, 50);

                // Median Line
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(w / 2 - 15, centerH - 25);
                ctx.lineTo(w / 2 - 15, centerH + 25);
                ctx.stroke();
                ctx.lineWidth = 1.5;

                // Outliers (Red Dots)
                ctx.fillStyle = '#FF5252';
                const outliersX = [40, 48, w - 60, w - 50, w - 35];
                outliersX.forEach(oX => {
                    ctx.beginPath();
                    ctx.arc(oX, centerH, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            else if (index === 14) {
                // Rolling Mean (Flat lines centered near zero)
                // 30d (Cyan)
                ctx.strokeStyle = '#06B6D4';
                ctx.beginPath();
                const points = 100;
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    const val = Math.sin(i / 2) * 5 + Math.cos(i / 4) * 3;
                    const y = (h / 2) - 5 + val;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // 90d (Yellow, very flat)
                ctx.strokeStyle = '#FFD700';
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    const val = Math.cos(i / 6) * 1.5;
                    const y = (h / 2) - 5 + val;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            else if (index === 15) {
                // Rolling Volatility (spiking and slowly decaying)
                ctx.strokeStyle = '#FFD700';
                ctx.beginPath();
                const points = 100;
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    let vol = 10; // 10% baseline
                    if (i > 40) {
                        // Spike & exponential decay model
                        vol += Math.exp(-(i - 40) * 0.05) * 12 + Math.sin(i / 2) * 0.8;
                    } else {
                        vol += Math.sin(i / 3) * 0.5;
                    }
                    const y = h - 25 - (vol / 25) * (h - 40);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            else if (index === 21) {
                // GARCH(1,1) Conditional Volatility Spikes
                ctx.strokeStyle = '#00E676';
                ctx.beginPath();
                const points = 120;
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    let vol = 9.5; // Baseline
                    // Primary Shock Spike
                    if (i > 50) {
                        vol += Math.exp(-(i - 50) * 0.04) * 11.5 + Math.sin(i / 2) * 0.5;
                    } else {
                        vol += Math.cos(i / 3) * 0.4;
                    }
                    // Minor secondary shock
                    if (i > 90) {
                        vol += Math.exp(-(i - 90) * 0.06) * 3.5;
                    }
                    const y = h - 25 - (vol / 25) * (h - 40);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            else if (index === 23) {
                // Drawdown Chart (Underwater shaded plot)
                ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                ctx.strokeStyle = '#EF4444';
                ctx.beginPath();
                const points = 100;
                ctx.moveTo(30, 20); // Top water level
                
                for (let i = 0; i < points; i++) {
                    const x = 30 + ((w - 40) / (points - 1)) * i;
                    let dd = 0; // Baseline
                    // Election decline mid-period
                    if (i > 40 && i < 80) {
                        dd = -12.5 * Math.sin(((i - 40) / 40) * Math.PI);
                    } else if (i >= 80) {
                        dd = -2.5 * Math.sin(((i - 80) / 20) * Math.PI);
                    }
                    const y = 20 - (dd / 15) * (h - 45);
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(w - 10, 20);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            else if (index === 24) {
                // Crash Detection & Volatility Clustering Scatter
                // Standard noise dots (Gray)
                ctx.fillStyle = '#64748B';
                for (let i = 0; i < 80; i++) {
                    const rX = 40 + Math.random() * (w - 60);
                    const rY = 25 + Math.random() * (h - 50);
                    ctx.beginPath();
                    ctx.arc(rX, rY, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Outliers / Crash Shocks (Large Red / Orange Stars or Dots)
                ctx.fillStyle = '#FF5252';
                const clusterPoints = [
                    { x: w / 2 - 20, y: h - 35 }, // June 4 Election Crash Point
                    { x: w / 2 - 15, y: 30 },     // Post-crash positive correction
                    { x: w / 2, y: h - 50 },      // Secondary drop
                    { x: w / 2 + 10, y: 40 }      // Secondary recovery
                ];
                clusterPoints.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // Draw surrounding alert circle
                    ctx.strokeStyle = 'rgba(255, 82, 82, 0.4)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                    ctx.stroke();
                });
            }
        }
    </script>
